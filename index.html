<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Meta viewport ajustado para evitar zoom automático al tocar inputs en móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mundial Tracker | Tu Seguimiento Personal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: slideFade 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideFade { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        
        /* Ocultar flechas de los inputs numéricos */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        /* Estilo moderno para el scrollbar (si se ve en PC) */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
    </style>
</head>
<body class="bg-gray-900 text-gray-200 font-sans antialiased pb-10">

    <!-- Header Moderno con Gradiente y bordes redondeados abajo -->
    <header class="bg-gradient-to-br from-blue-900 to-indigo-950 text-white shadow-lg rounded-b-[2rem] pb-10 pt-8 px-4 relative z-10 text-center">
        <div class="max-w-md mx-auto">
            <h1 class="text-2xl font-extrabold tracking-tight">🏆 Mundial Tracker</h1>
            <p class="text-blue-300 text-xs mt-2 font-semibold tracking-wide">Aplicación creada por Jorge Hernández © 2026</p>
            <p class="text-blue-200/60 text-[11px] mt-1">Tu progreso se guarda localmente</p>
            
            <!-- Cuenta Regresiva -->
            <div id="countdown" class="mt-4 bg-gray-900/40 rounded-full py-1.5 px-5 inline-block text-sm font-bold text-yellow-400 border border-blue-700/50 shadow-inner backdrop-blur-sm">
                ⏳ Calculando tiempo...
            </div>
        </div>
    </header>

    <!-- Navegación estilo "Píldora" (Flotante) -->
    <div class="max-w-md mx-auto px-4 relative z-20 -mt-7 mb-6">
        <nav class="bg-gray-800 p-1.5 rounded-full shadow-md flex justify-between items-center ring-1 ring-gray-700">
            <button onclick="switchTab('partidos')" id="tab-partidos" class="w-1/2 py-2.5 rounded-full text-sm font-bold bg-blue-600 text-white shadow-sm transition-all">📅 Partidos</button>
            <button onclick="switchTab('grupos')" id="tab-grupos" class="w-1/2 py-2.5 rounded-full text-sm font-bold text-gray-400 hover:text-blue-300 transition-all">📊 Grupos</button>
        </nav>
    </div>

    <!-- Contenido Principal -->
    <main class="max-w-md mx-auto px-4">
        
        <!-- SECCIÓN 1: Calendario -->
        <section id="partidos" class="tab-content active">
            <div class="flex justify-between items-center mb-4 px-1">
                <h2 class="text-xl font-bold text-gray-100">Fase de Grupos</h2>
                <button onclick="resetData()" class="text-xs font-semibold text-red-400 bg-red-900/30 px-3 py-1.5 rounded-full hover:bg-red-900/50 active:scale-95 transition-transform">Borrar todo</button>
            </div>
            
            <!-- Contenedor de Partidos -->
            <div id="matches-container" class="space-y-4">
                <!-- Inyectado por JS -->
            </div>
        </section>

        <!-- SECCIÓN 2: Tablas de Grupos -->
        <section id="grupos" class="tab-content">
            <h2 class="text-xl font-bold text-gray-100 mb-4 px-1">Clasificación General</h2>
            <div id="standings-container" class="space-y-6">
                <!-- Inyectado por JS -->
            </div>
            
            <!-- Botón de Compartir en WhatsApp -->
            <div class="mt-8 mb-4 text-center">
                <button onclick="shareWhatsApp()" class="w-full bg-[#25D366] hover:bg-[#20b858] text-white font-bold py-3.5 px-6 rounded-2xl shadow-lg flex items-center justify-center gap-2 transition-all active:scale-95 border border-[#1da850]">
                    <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg>
                    Compartir mis pronósticos
                </button>
            </div>
        </section>

    </main>

    <!-- LÓGICA DE LA APLICACIÓN (Vanilla JS) -->
    <script>
        const worldCupGroups = {
            'A': ['México', 'Sudáfrica', 'Corea del Sur', 'Chequia'],
            'B': ['Canadá', 'Bosnia y Herz.', 'Catar', 'Suiza'],
            'C': ['Brasil', 'Marruecos', 'Haití', 'Escocia'],
            'D': ['EE. UU.', 'Paraguay', 'Australia', 'Turquía'],
            'E': ['Alemania', 'Curazao', 'Costa de Marfil', 'Ecuador'],
            'F': ['Países Bajos', 'Japón', 'Suecia', 'Túnez'],
            'G': ['Bélgica', 'Egipto', 'Irán', 'Nueva Zelanda'],
            'H': ['España', 'Cabo Verde', 'Arabia Saudí', 'Uruguay'],
            'I': ['Francia', 'Senegal', 'Irak', 'Noruega'],
            'J': ['Argentina', 'Argelia', 'Austria', 'Jordania'],
            'K': ['Portugal', 'RD Congo', 'Uzbekistán', 'Colombia'],
            'L': ['Inglaterra', 'Croacia', 'Ghana', 'Panamá']
        };

        const initialData = [];
        let matchId = 1;

        const startDate = new Date(2026, 5, 11);
        const crTimeSlots = ['10:00 AM', '01:00 PM', '04:00 PM', '07:00 PM'];
        let currentDayOffset = 0;
        let matchCounter = 0;

        for (const [group, teams] of Object.entries(worldCupGroups)) {
            const matchups = [[0, 1], [2, 3], [0, 2], [3, 1], [3, 0], [1, 2]];
            
            matchups.forEach(pair => {
                let matchDate = new Date(startDate);
                matchDate.setDate(startDate.getDate() + currentDayOffset);
                let dateStr = matchDate.toLocaleDateString('es-CR', { day: 'numeric', month: 'short' });
                let timeStr = crTimeSlots[matchCounter % 4];

                initialData.push({
                    id: matchId++,
                    group: group,
                    teamA: teams[pair[0]],
                    teamB: teams[pair[1]],
                    scoreA: '',
                    scoreB: '',
                    date: `${dateStr} • ${timeStr}`,
                    watched: false,
                    notes: ''
                });

                matchCounter++;
                if (matchCounter % 4 === 0) currentDayOffset++;
            });
        }

        // --- PRECARGAR RESULTADOS REALES (11 y 12 de Junio) ---
        // Aquí están los resultados oficiales de los primeros dos días del Mundial
        const resultadosOficiales = [
            { teamA: 'México', teamB: 'Sudáfrica', scoreA: 2, scoreB: 0 },
            { teamA: 'Corea del Sur', teamB: 'República Checa', scoreA: 2, scoreB: 1 }, // Chequia aparece a veces como República Checa en los datos
            { teamA: 'Corea del Sur', teamB: 'Chequia', scoreA: 2, scoreB: 1 },         // Agregamos ambas variaciones por si acaso
            { teamA: 'Canadá', teamB: 'Bosnia y Herz.', scoreA: 1, scoreB: 1 },
            { teamA: 'EE. UU.', teamB: 'Paraguay', scoreA: 4, scoreB: 1 }
        ];

        // Recorremos los datos iniciales y sobreescribimos con los resultados reales
        initialData.forEach(match => {
            resultadosOficiales.forEach(res => {
                // Buscamos coincidencia exacta de los equipos, sin importar el orden (Local o Visitante)
                if (match.teamA === res.teamA && match.teamB === res.teamB) {
                    match.scoreA = res.scoreA;
                    match.scoreB = res.scoreB;
                    match.watched = true;
                    match.notes = "✅ Resultado Oficial";
                } else if (match.teamA === res.teamB && match.teamB === res.teamA) {
                    match.scoreA = res.scoreB;
                    match.scoreB = res.scoreA;
                    match.watched = true;
                    match.notes = "✅ Resultado Oficial";
                }
            });
        });

        const STORAGE_KEY = 'jorge_worldcup_2026_live_v2'; // Cambié la clave para forzar el reinicio con los datos correctos

        function getData() {
            const stored = localStorage.getItem(STORAGE_KEY);
            return stored ? JSON.parse(stored) : JSON.parse(JSON.stringify(initialData));
        }

        function saveData(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        function resetData() {
            const pin = prompt('Introduce la clave de seguridad para borrar todo:');
            if (pin === '8384') {
                if(confirm('¿Seguro que quieres borrar todos tus marcadores? Esta acción no se puede deshacer.')) {
                    localStorage.removeItem(STORAGE_KEY);
                    init();
                }
            } else if (pin !== null) {
                alert('Clave incorrecta. No se han borrado los datos.');
            }
        }

        function updateMatch(id, field, value) {
            const data = getData();
            const matchIndex = data.findIndex(m => m.id === id);
            if (matchIndex > -1) {
                if (field === 'scoreA' || field === 'scoreB') {
                    data[matchIndex][field] = value === '' ? '' : parseInt(value, 10);
                } else {
                    data[matchIndex][field] = value;
                }
                saveData(data);
                
                if (field === 'scoreA' || field === 'scoreB') {
                    renderStandings();
                }
            }
        }

        function toggleWatched(id) {
            const data = getData();
            const match = data.find(m => m.id === id);
            if(match) {
                updateMatch(id, 'watched', !match.watched);
                renderMatches();
            }
        }

        function renderMatches() {
            const container = document.getElementById('matches-container');
            const data = getData();
            container.innerHTML = '';

            data.forEach(match => {
                const isWatched = match.watched;
                const card = document.createElement('div');
                card.className = `bg-gray-800 rounded-3xl shadow-md p-5 relative overflow-hidden transition-all duration-300 ${isWatched ? 'ring-2 ring-green-500 bg-green-900/20' : 'border border-gray-700'}`;
                
                card.innerHTML = `
                    <div class="flex justify-between items-center text-xs text-gray-400 font-medium mb-4">
                        <span class="bg-gray-700 text-gray-300 px-3 py-1 rounded-full">Grupo ${match.group}</span>
                        <span>🗓️ ${match.date}</span>
                    </div>
                    
                    <div class="flex items-center justify-between mb-5">
                        <div class="flex-1 text-right font-bold text-gray-100 text-base leading-tight pr-2">${match.teamA}</div>
                        
                        <div class="flex items-center gap-2 bg-gray-900 p-1.5 rounded-2xl shadow-inner">
                            <input type="number" inputmode="numeric" class="w-12 h-12 bg-gray-800 text-center rounded-xl text-xl font-black text-blue-400 border-none shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none placeholder-gray-600 transition-all" 
                                placeholder="-"
                                value="${match.scoreA !== '' ? match.scoreA : ''}" 
                                onchange="updateMatch(${match.id}, 'scoreA', this.value)">
                            
                            <span class="text-gray-500 font-bold">:</span>
                            
                            <input type="number" inputmode="numeric" class="w-12 h-12 bg-gray-800 text-center rounded-xl text-xl font-black text-blue-400 border-none shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none placeholder-gray-600 transition-all" 
                                placeholder="-"
                                value="${match.scoreB !== '' ? match.scoreB : ''}" 
                                onchange="updateMatch(${match.id}, 'scoreB', this.value)">
                        </div>
                        
                        <div class="flex-1 text-left font-bold text-gray-100 text-base leading-tight pl-2">${match.teamB}</div>
                    </div>

                    <div class="flex flex-col gap-3">
                        <div class="flex justify-between items-end px-1">
                            <label class="text-xs font-bold text-gray-400">Tus Notas</label>
                            <button onclick="predictMatch(${match.id})" class="text-[10px] font-bold text-purple-300 bg-purple-900/50 px-3 py-1.5 rounded-full shadow-sm hover:bg-purple-800 active:scale-95 transition-all flex items-center gap-1 uppercase tracking-wider border border-purple-700/50">✨ Predictor IA</button>
                        </div>
                        <textarea id="notes-${match.id}" class="w-full text-sm bg-gray-900 border border-gray-700 rounded-2xl p-3 text-gray-200 focus:ring-2 focus:ring-blue-500 focus:outline-none resize-none h-14 transition-all" 
                            placeholder="Añadir una nota o predicción..."
                            onblur="updateMatch(${match.id}, 'notes', this.value)">${match.notes}</textarea>
                        
                        <button onclick="toggleWatched(${match.id})" class="w-full py-2.5 rounded-xl text-sm font-bold flex justify-center items-center gap-2 transition-all ${isWatched ? 'bg-green-900/40 text-green-400 border border-green-800/50' : 'bg-gray-700 text-gray-300 hover:bg-gray-600'}">
                            ${isWatched ? '✅ Partido Visto' : '👁️ Marcar como visto'}
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function calculateGroupStandings(groupMatches) {
            const teams = {};
            groupMatches.forEach(m => {
                if (!teams[m.teamA]) teams[m.teamA] = { name: m.teamA, pts: 0, pj: 0, g: 0, e: 0, p: 0, gf: 0, gc: 0, dif: 0 };
                if (!teams[m.teamB]) teams[m.teamB] = { name: m.teamB, pts: 0, pj: 0, g: 0, e: 0, p: 0, gf: 0, gc: 0, dif: 0 };
            });

            groupMatches.forEach(m => {
                if (m.scoreA !== '' && m.scoreB !== '') {
                    const sa = parseInt(m.scoreA);
                    const sb = parseInt(m.scoreB);
                    const ta = teams[m.teamA];
                    const tb = teams[m.teamB];

                    ta.pj++; tb.pj++;
                    ta.gf += sa; ta.gc += sb;
                    tb.gf += sb; tb.gc += sa;

                    if (sa > sb) { ta.pts += 3; ta.g++; tb.p++; } 
                    else if (sa < sb) { tb.pts += 3; tb.g++; ta.p++; } 
                    else { ta.pts += 1; tb.pts += 1; ta.e++; tb.e++; }
                }
            });

            const standings = Object.values(teams).map(t => { t.dif = t.gf - t.gc; return t; });
            standings.sort((a, b) => {
                if (b.pts !== a.pts) return b.pts - a.pts;
                if (b.dif !== a.dif) return b.dif - a.dif;
                return b.gf - a.gf;
            });
            return standings;
        }

        function renderStandings() {
            const container = document.getElementById('standings-container');
            const data = getData();
            container.innerHTML = '';

            const groups = [...new Set(data.map(m => m.group))].sort();

            groups.forEach(groupLetter => {
                const groupMatches = data.filter(m => m.group === groupLetter);
                const standings = calculateGroupStandings(groupMatches);

                const tableHTML = `
                    <div class="bg-gray-800 rounded-3xl shadow-md border border-gray-700 overflow-hidden mb-2">
                        <div class="bg-gradient-to-r from-gray-900 to-gray-800 text-gray-100 px-5 py-3 font-bold text-sm flex justify-between items-center border-b border-gray-700">
                            <span>Grupo ${groupLetter}</span>
                            <button onclick="analyzeGroup('${groupLetter}')" class="text-[10px] font-bold text-purple-300 bg-purple-900/50 border border-purple-700/50 px-3 py-1 rounded-full hover:bg-purple-800 active:scale-95 transition-all flex items-center gap-1 shadow-inner uppercase tracking-wider">✨ Análisis IA</button>
                        </div>
                        <div id="analysis-${groupLetter}" class="px-5 py-4 text-sm text-gray-200 bg-purple-900/20 hidden border-b border-purple-800/30 shadow-inner leading-relaxed"></div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-sm text-left whitespace-nowrap">
                                <thead class="bg-gray-900 text-gray-400 text-xs font-bold border-b border-gray-700">
                                    <tr>
                                        <th class="px-4 py-3">País</th>
                                        <th class="px-2 py-3 text-center">PTS</th>
                                        <th class="px-2 py-3 text-center">PJ</th>
                                        <th class="px-2 py-3 text-center">DIF</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${standings.map((team, index) => `
                                        <tr class="border-b border-gray-700 last:border-0 ${index < 2 ? 'bg-green-900/20' : ''}">
                                            <td class="px-4 py-3.5 font-bold text-gray-200 flex items-center gap-2">
                                                <span class="text-xs font-bold ${index < 2 ? 'text-green-400' : 'text-gray-500'} w-4">${index + 1}</span> 
                                                ${team.name}
                                            </td>
                                            <td class="px-2 py-3.5 text-center font-black text-blue-400">${team.pts}</td>
                                            <td class="px-2 py-3.5 text-center font-medium text-gray-400">${team.pj}</td>
                                            <td class="px-2 py-3.5 text-center font-bold ${team.dif > 0 ? 'text-green-400' : team.dif < 0 ? 'text-red-400' : 'text-gray-500'}">
                                                ${team.dif > 0 ? '+'+team.dif : team.dif}
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
                container.innerHTML += tableHTML;
            });
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            
            const btnPartidos = document.getElementById('tab-partidos');
            const btnGrupos = document.getElementById('tab-grupos');

            const activeClass = "w-1/2 py-2.5 rounded-full text-sm font-bold bg-blue-600 text-white shadow-sm transition-all";
            const inactiveClass = "w-1/2 py-2.5 rounded-full text-sm font-bold text-gray-400 hover:text-blue-300 transition-all bg-transparent shadow-none";

            if(tabId === 'partidos') {
                btnPartidos.className = activeClass;
                btnGrupos.className = inactiveClass;
                renderMatches();
            } else {
                btnGrupos.className = activeClass;
                btnPartidos.className = inactiveClass;
                renderStandings(); 
            }
        }

        // Función para inicializar la cuenta regresiva
        function initCountdown() {
            const openingMatch = new Date(2026, 5, 11, 10, 0, 0); 
            
            const updateTimer = () => {
                const now = new Date();
                const diff = openingMatch - now;
                const el = document.getElementById('countdown');
                
                if (diff <= 0) {
                    el.innerHTML = "⚽ ¡EL MUNDIAL HA COMENZADO! 🏆";
                    el.classList.replace('text-yellow-400', 'text-green-400');
                    return;
                }
                
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                
                if (days > 0) {
                    el.innerHTML = `⏳ Faltan ${days} días y ${hours} hrs para el inicio`;
                } else if (hours > 0) {
                    el.innerHTML = `⏳ ¡Hoy empieza! Faltan ${hours} horas`;
                } else {
                    el.innerHTML = `⏳ ¡A punto de comenzar!`;
                }
            };
            
            updateTimer();
            setInterval(updateTimer, 1000 * 60 * 60);
        }

        // Función para generar texto y enviar a WhatsApp
        function shareWhatsApp() {
            const data = getData();
            let text = "🏆 *Mis clasificados del Mundial 2026* (App de Jorge Hernández)\n\n";
            
            const groups = [...new Set(data.map(m => m.group))].sort();
            
            groups.forEach(groupLetter => {
                const groupMatches = data.filter(m => m.group === groupLetter);
                const standings = calculateGroupStandings(groupMatches);
                
                text += `*Grupo ${groupLetter}:*\n1️⃣ ${standings[0].name} (${standings[0].pts} pts)\n2️⃣ ${standings[1].name} (${standings[1].pts} pts)\n\n`;
            });
            
            text += "¡Haz tus pronósticos tú también! ⚽";
            const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        }

        const apiKey = ""; 
        const geminiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

        async function callGeminiAPI(prompt, isJSON = false) {
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: { parts: [{ text: "Eres un apasionado comentarista deportivo experto en el Mundial de Fútbol." }] }
            };

            if (isJSON) {
                payload.generationConfig = {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            scoreA: { type: "INTEGER" },
                            scoreB: { type: "INTEGER" },
                            analysis: { type: "STRING" }
                        }
                    }
                };
            }

            const delays = [1000, 2000, 4000, 8000, 16000];
            
            for (let attempt = 0; attempt < 6; attempt++) {
                try {
                    const response = await fetch(geminiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    
                    const data = await response.json();
                    let textResult = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    
                    if (!textResult) throw new Error("Respuesta vacía de la IA");
                    
                    if (isJSON) return JSON.parse(textResult);
                    return textResult;

                } catch (error) {
                    if (attempt < 5) await new Promise(res => setTimeout(res, delays[attempt]));
                    else return null;
                }
            }
        }

        async function predictMatch(id) {
            const data = getData();
            const match = data.find(m => m.id === id);
            if (!match) return;

            const textarea = document.getElementById(`notes-${id}`);
            if (textarea) textarea.value = "Consultando a los oráculos del fútbol... ✨⚽";

            const prompt = `Analiza un posible partido del Mundial 2026 entre ${match.teamA} y ${match.teamB}. Haz una predicción de goles realista basada en su historia y su nivel actual. Genera también una breve línea de justificación dramática (ej. "La velocidad de sus extremos marcará la diferencia").`;
            
            const result = await callGeminiAPI(prompt, true);
            
            if (result && result.scoreA !== undefined && result.scoreB !== undefined) {
                updateMatch(id, 'scoreA', result.scoreA);
                updateMatch(id, 'scoreB', result.scoreB);
                updateMatch(id, 'notes', `✨ Predicción IA: ${result.analysis}`);
                
                renderMatches();
                renderStandings(); 
            } else {
                if (textarea) textarea.value = "⚠️ La conexión con la IA falló en este momento. Intenta de nuevo.";
            }
        }

        async function analyzeGroup(groupLetter) {
            const analysisDiv = document.getElementById(`analysis-${groupLetter}`);
            analysisDiv.classList.remove('hidden');
            analysisDiv.innerHTML = "<div class='flex items-center gap-2 text-purple-300 animate-pulse'><span>✨</span> Analizando el panorama del grupo...</div>";

            const data = getData();
            const groupMatches = data.filter(m => m.group === groupLetter);
            const standings = calculateGroupStandings(groupMatches);
            
            const standingsText = standings.map((t, i) => `${i+1}º ${t.name} (Pts: ${t.pts}, Goles Dif: ${t.dif})`).join(" | ");
            
            const prompt = `Aquí está la tabla de posiciones actual del Grupo ${groupLetter} del Mundial: [ ${standingsText} ]. Escribe un comentario deportivo corto y muy dramático (máximo 3 oraciones) describiendo la situación. ¿Quién lidera firmemente? ¿Quién está contra las cuerdas o cerca de la eliminación? Usa un tono emocionante como el de la televisión.`;

            const result = await callGeminiAPI(prompt, false);
            
            if (result) {
                analysisDiv.innerHTML = `<strong class="text-purple-300">🗣️ Análisis en cabina:</strong> ${result}`;
            } else {
                analysisDiv.innerHTML = "<span class='text-red-400'>⚠️ No se pudo recibir la señal desde cabina. Inténtalo de nuevo.</span>";
            }
        }

        function init() {
            renderMatches();
            renderStandings();
            initCountdown();
        }

        window.onload = init;
    </script>
</body>
</html>
